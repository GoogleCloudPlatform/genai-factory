name: gf-geap-hp-0

# Enable APIs
services:
  - compute.googleapis.com
  # To create response policies for Private Google APIs
  - dns.googleapis.com

# Grant roles
iam_by_principals:
  $iam_principals:service_accounts/service-01/iac-rw:
    # Agent Gateway: allows creating the PSC network attachment
    # in the shared VPC
    - roles/compute.networkUser
    # Agent Gateway: allows backend validation of network resources
    - roles/compute.networkViewer
    # Agent Gateway: allows validation of DNS resources
    - roles/dns.reader
  $iam_principals:service_agents/service-01/agentgateway:
    # Agent Gateway: allows the service agent to use the host project subnet
    # for the network attachment and connect the PSC-I to route egress traffic
    - roles/compute.networkUser
    # Agent Gateway: allows the service agent peer with private Cloud DNS zones
    # in the host project.
    - roles/dns.peer
