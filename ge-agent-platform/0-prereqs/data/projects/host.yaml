name: gf-ge-agentp

# Enable APIs
services:
  - compute.googleapis.com
  # To create response policies for Private Google APIs
  - dns.googleapis.com
  # To orchestrate the private connection pathways and route allocations between Google-managed networks and your Host Project
  - servicenetworking.googleapis.com

# Grant roles
iam_by_principals:
  $iam_principals:service_accounts/service-01/iac-rw:
    # To allow the creation of LBsin the service project
    - roles/compute.networkUser
    # To allow DNS peering to the host project VPC network
    - roles/dns.peer
    # To allow viewing VPC network resources during provisioning
    - roles/compute.networkViewer
