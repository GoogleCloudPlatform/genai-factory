name: gf-ge-agentp-0

# Enable APIs
services:
  # To create TF state buckets
  - storage.googleapis.com
  # Agent Registry
  - agentregistry.googleapis.com
  # Gemini Enterprise
  - aiplatform.googleapis.com
  - discoveryengine.googleapis.com
  # Agent Gateway & Networking
  - cloudresourcemanager.googleapis.com
  - compute.googleapis.com
  - iamcredentials.googleapis.com
  - iap.googleapis.com
  - modelarmor.googleapis.com
  - networksecurity.googleapis.com
  - networkservices.googleapis.com
  - orgpolicy.googleapis.com
  - serviceusage.googleapis.com

org_policies:
  iam.managed.disableAccessPolicyBinding:
    rules:
      - enforce: false

buckets:
  iac-state:
    description: Terraform state bucket
    iam:
      roles/storage.objectAdmin:
        - $iam_principals:service_accounts/_self_/iac-rw

service_accounts:
  # Automation SA
  iac-rw: {}

# Grant roles
iam_by_principals:
  $iam_principals:service_accounts/_self_/iac-rw:
    - roles/discoveryengine.admin
    # Model Armor
    - roles/modelarmor.admin
    - roles/modelarmor.floorSettingsAdmin
    - roles/serviceusage.serviceUsageConsumer
    - roles/storage.admin
    # The following role assignments are used to create and manage Agent Gateways
    - roles/compute.networkAdmin
    - roles/networkservices.admin
    - roles/networksecurity.admin
    - roles/agentregistry.admin
  # Service Extensions Service Agent for Model Armor runtime inspection
  $iam_principals:service_agents/_self_/dep:
    - roles/modelarmor.user
    - roles/modelarmor.calloutUser
    - roles/serviceusage.serviceUsageConsumer
  # Vertex AI Service Agent to invoke Model Armor for floor setting evaluation
  $iam_principals:service_agents/_self_/aiplatform:
    - roles/modelarmor.user
