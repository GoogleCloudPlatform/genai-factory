name: gf-ge-agentplatform-0

# Enable APIs
services:
  - dialogflow.googleapis.com
  - discoveryengine.googleapis.com
  # Needed for Cloud Function (function create only)
  - artifactregistry.googleapis.com
  - cloudbuild.googleapis.com
  - cloudfunctions.googleapis.com
  - logging.googleapis.com
  - run.googleapis.com
  # Needed for Service Directory DNS zone
  - dns.googleapis.com
  # Needed for TCP proxy ILB creation (function create only)
  - certificatemanager.googleapis.com
  - privateca.googleapis.com
  # Only needed if you define private endpoints to be reached
  - servicedirectory.googleapis.com
  - compute.googleapis.com
  - networksecurity.googleapis.com
  - networkservices.googleapis.com
  - iam.googleapis.com
  - aiplatform.googleapis.com
  - storage.googleapis.com
  - discoveryengine.googleapis.com
  - agentregistry.googleapis.com
  - modelarmor.googleapis.com
  - observability.googleapis.com
  - telemetry.googleapis.com
  - monitoring.googleapis.com
  - cloudtrace.googleapis.com
  - apphub.googleapis.com
  - apptopology.googleapis.com
  - cloudapiregistry.googleapis.com
  - notebooks.googleapis.com
  - texttospeech.googleapis.com
  - dataform.googleapis.com

buckets:
  iac-state:
    description: Terraform state bucket
    iam:
      roles/storage.objectAdmin:
        - $iam_principals:service_accounts/_self_/iac-rw

service_accounts:
  # Automation SAs
  iac-rw:
    iam_bindings_additive:
      cloud-run-token-creator:
        member: $iam_principals:service_agents/_self_/cloudrun
        role: roles/iam.serviceAccountTokenCreator


# Grant roles
iam_by_principals:
  $iam_principals:service_accounts/_self_/iac-rw:
    - roles/dialogflow.admin
    - roles/discoveryengine.admin
    - roles/serviceusage.serviceUsageConsumer
    - roles/storage.admin
    # Needed for Service Directory DNS zone
    - roles/dns.admin
  # The following role assignments are used to create and manage Agent Gateways 
    - roles/compute.networkAdmin
    - roles/networkservices.admin
    - roles/networksecurity.admin
    - roles/agentregistry.admin

