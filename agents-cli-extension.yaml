# yaml-language-server: $schema=https://raw.githubusercontent.com/google/agents-cli/main/schemas/agents-cli-extension-v1alpha1.schema.json
schema: agents-cli-extension/v1alpha1
name: genai-factory
description: >-
  Production-grade Terraform blueprints and skills for deploying secure
  generative AI infrastructure on Google Cloud.
requires:
  agents_cli: '>=1.12,<2'
  on_incompatible: warn
skills:
  genai-factory:
    path: .agents/skills/genai-factory
  prerequisites-and-fast:
    path: .agents/skills/prerequisites-and-fast
  cloud-run-and-load-balancers:
    path: .agents/skills/cloud-run-and-load-balancers
  model-armor:
    path: .agents/skills/model-armor
  discovery-engine-and-gecx:
    path: .agents/skills/discovery-engine-and-gecx
  operations-and-teardown:
    path: .agents/skills/operations-and-teardown
