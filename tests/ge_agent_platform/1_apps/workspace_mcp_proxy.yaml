    agent_spec: []
    deletion_policy: PREVENT
    description: Cloud Run MCP proxy enforcing internal corporate recipient domains
      on Gmail and Google Calendar.
    display_name: Workspace Domain-Guardrail MCP Proxy
    endpoint_spec: []
    interfaces:
      - protocol_binding: JSONRPC
    location: us-central1
    mcp_server_spec:
      - content: "{\"tools\":[{\"annotations\":{\"destructiveHint\":true,\"idempotentHint\"\
          :false,\"openWorldHint\":false,\"readOnlyHint\":false},\"description\":\"\
          Sends a Gmail message strictly to allowlisted internal corporate domains\
          \ after Human-in-the-Loop confirmation.\",\"inputSchema\":{\"properties\"\
          :{\"bcc\":{\"description\":\"Optional BCC email addresses inside the allowed\
          \ corporate domain.\",\"items\":{\"type\":\"string\"},\"type\":\"array\"\
          },\"body\":{\"description\":\"Plain-text email body.\",\"type\":\"string\"\
          },\"cc\":{\"description\":\"Optional CC email addresses inside the allowed\
          \ corporate domain.\",\"items\":{\"type\":\"string\"},\"type\":\"array\"\
          },\"subject\":{\"description\":\"Email subject line.\",\"type\":\"string\"\
          },\"to\":{\"description\":\"Recipient email addresses inside the allowed\
          \ corporate domain.\",\"items\":{\"type\":\"string\"},\"type\":\"array\"\
          }},\"required\":[\"to\",\"subject\",\"body\"],\"type\":\"object\"},\"name\"\
          :\"send_internal_email\"},{\"annotations\":{\"destructiveHint\":false,\"\
          idempotentHint\":false,\"openWorldHint\":false,\"readOnlyHint\":false},\"\
          description\":\"Creates a Gmail draft while deterministically rejecting\
          \ any external recipient domain.\",\"inputSchema\":{\"properties\":{\"bcc\"\
          :{\"description\":\"Optional internal BCC email addresses.\",\"items\":{\"\
          type\":\"string\"},\"type\":\"array\"},\"body\":{\"description\":\"Draft\
          \ email body.\",\"type\":\"string\"},\"cc\":{\"description\":\"Optional\
          \ internal CC email addresses.\",\"items\":{\"type\":\"string\"},\"type\"\
          :\"array\"},\"subject\":{\"description\":\"Draft email subject line.\",\"\
          type\":\"string\"},\"to\":{\"description\":\"Optional internal recipient\
          \ email addresses.\",\"items\":{\"type\":\"string\"},\"type\":\"array\"\
          }},\"required\":[\"subject\",\"body\"],\"type\":\"object\"},\"name\":\"\
          create_email_draft\"},{\"annotations\":{\"destructiveHint\":true,\"idempotentHint\"\
          :false,\"openWorldHint\":false,\"readOnlyHint\":false},\"description\":\"\
          Creates a Google Calendar event on the caller's primary calendar, allowing\
          \ only internal corporate attendee domains.\",\"inputSchema\":{\"properties\"\
          :{\"attendees\":{\"description\":\"Optional internal attendee email addresses.\"\
          ,\"items\":{\"type\":\"string\"},\"type\":\"array\"},\"description\":{\"\
          description\":\"Optional event description.\",\"type\":\"string\"},\"end_time\"\
          :{\"description\":\"RFC-3339 end timestamp (for example, 2026-11-17T15:30:00Z).\"\
          ,\"type\":\"string\"},\"start_time\":{\"description\":\"RFC-3339 start timestamp\
          \ (for example, 2026-11-17T15:00:00Z).\",\"type\":\"string\"},\"summary\"\
          :{\"description\":\"Calendar event title.\",\"type\":\"string\"}},\"required\"\
          :[\"summary\",\"start_time\",\"end_time\"],\"type\":\"object\"},\"name\"\
          :\"create_internal_calendar_event\"}]}"
        type: TOOL_SPEC
    project: test-gf-geap-0
    service_id: workspace-mcp-proxy
    timeouts:
